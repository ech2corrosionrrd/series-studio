# External probe (runs on GitHub, not on our VPS) so a dead host is visible even when the
# server's own cron, alerts and runner are all down with it. The schedule is best effort:
# GitHub may delay it by minutes, and disables it after 60 days without repo activity.
# This does not page anyone; a red run (and GitHub's failure e-mail) is the signal.
# Read-only: GET/HEAD on public endpoints. See docs/DEPLOY.md.
name: Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public endpoints
        run: |
          set -u
          fail=0
          code_of() { curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 "$1" || echo 000; }
          probe() {
            local name=$1 url=$2 expect=$3 code
            code=$(code_of "$url")
            if [ "$code" = "$expect" ]; then echo "OK   $code  $name ($url)"
            else echo "FAIL $code (expected $expect)  $name ($url)"; fail=1; fi
          }
          probe "lab.w3ir.io Series Lab"        https://lab.w3ir.io/health           200
          probe "gen.w3ir.io production API"    https://gen.w3ir.io/health           200
          probe "studio.w3ir.io landing"        https://studio.w3ir.io/              200
          probe "studio.w3ir.io en landing"     https://studio.w3ir.io/en/           200
          probe "studio.w3ir.io guide"          https://studio.w3ir.io/guide/        200
          probe "studio.w3ir.io unknown path"   https://studio.w3ir.io/__no_such__   404

          # The landing must keep its security headers (`_headers`, generated by scripts/build-site.mjs).
          hdrs=$(curl -sSI --max-time 20 --retry 2 https://studio.w3ir.io/ | tr -d '\r' | tr 'A-Z' 'a-z')
          for h in content-security-policy "x-frame-options: deny" "x-content-type-options: nosniff"; do
            if printf '%s\n' "$hdrs" | grep -q "^$h"; then echo "OK   header $h"
            else echo "FAIL missing header $h on studio.w3ir.io"; fail=1; fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::A public endpoint is unreachable or misconfigured — check Cloudflare (DNS/Pages) and the VPS (docker compose ps)"
            exit 1
          fi
