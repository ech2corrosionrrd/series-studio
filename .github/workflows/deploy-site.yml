# Auto-deploy of the public site (https://studio.w3ir.io) to Cloudflare Pages.
# Builds dist/site from the locale texts and uploads it to the existing
# Direct Upload project "series-lab". See docs/DEPLOY.md.
#
# Tests are not run here: the check is local (`npm run ci`, pre-push hook).
#
# Required repository settings:
#   secret   CLOUDFLARE_API_TOKEN  — token with "Account · Cloudflare Pages · Edit"
#   variable CLOUDFLARE_ACCOUNT_ID — Cloudflare account id
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-site.mjs"
      - "scripts/site-pages.mjs"
      - "server/ui/locales/**"
      - "scripts/site-*.mjs"
      - "scripts/legal-pages.mjs"
      - "scripts/inline-md.mjs"
      - "docs/legal/published/**"
      - "package.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build site
        run: node scripts/build-site.mjs

      - name: Check build output
        run: |
          node --input-type=module -e '
            import { existsSync, statSync } from "node:fs";
            import { publicPaths } from "./scripts/site-pages.mjs";
            const missing = [];
            for (const p of publicPaths()) {
              const rel = p === "/" ? "index.html" : `${p.slice(1)}index.html`;
              const file = `dist/site/${rel}`;
              if (!existsSync(file) || statSync(file).size < 200) missing.push(file);
            }
            for (const file of ["dist/site/404.html", "dist/site/_headers", "dist/site/sitemap.xml"]) {
              if (!existsSync(file) || statSync(file).size === 0) missing.push(file);
            }
            if (missing.length) {
              console.error("::error::" + missing.join("\n"));
              process.exit(1);
            }
          '

      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name=series-lab --branch=main --commit-dirty=true

      - name: Token not configured
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — site built but not deployed. See docs/DEPLOY.md."
