# Series Lab service — reference template (phase3.sh generates an equivalent file for staging).
# Series Lab is a standalone product: its own image, its own data directory, its own secrets
# (.env.series-lab built from lab.env) and its own backups. Procedure: docs/DEPLOY-PLATFORM.md.
#
# Data: ./${SERIES_LAB_DATA:-data-next} holds users.db (the ledger), users/ (per-wallet data)
# and small JSON sidecars. It starts empty and is created by Series Lab itself.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  serieslab:
    image: ${SERIES_LAB_IMAGE:-series-lab:local}
    container_name: series-lab
    env_file: .env.series-lab
    volumes:
      - ./${SERIES_LAB_DATA:-data-next}:/data
      # Optional: Sugar checkout for NFT vault transfers (scripts/transfer-nft.mjs), read-only.
      - ${SUGAR_HOST_PATH:-/opt/sugar}:/opt/sugar:ro
    environment:
      SUGAR_PROJECT_PATH: /opt/sugar
      # HOST in the image is 0.0.0.0. This list turns the Host check back on.
      SERIES_ALLOWED_HOSTS: ${SERIES_ALLOWED_HOSTS:-next.w3ir.io}
    expose:
      - "5344"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5344/health"]
      interval: 30s
      timeout: 10s
      retries: 3
