# Series Lab service — reference template (phase3.sh generates an equivalent file for staging).
# Series Lab is a standalone product: its own image, its own data directory, its own secrets
# (.env.series-lab built from lab.env) and its own backups. Procedure: docs/DEPLOY-PLATFORM.md.
#
# Data: ./${SERIES_LAB_DATA:-data-next} holds users.db (the ledger), users/ (per-wallet data)
# and small JSON sidecars. It starts empty and is created by Series Lab itself.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  serieslab:
    image: ${SERIES_LAB_IMAGE:-series-lab:local}
    container_name: series-lab
    env_file: .env.series-lab
    # Image runs as uid 1000 (node). The data dir on the host must be writable by 1000.
    user: "1000:1000"
    volumes:
      - ./${SERIES_LAB_DATA:-data-next}:/data
      # Sugar is not mounted. The vault is off. To add a read-only checkout later:
      # - ${SUGAR_HOST_PATH}:/opt/sugar:ro
      # and set SUGAR_PROJECT_PATH=/opt/sugar. The directory must be readable by uid 1000.
    environment:
      # HOST in the image is 0.0.0.0. These three must name the studio process,
      # not the Pages site studio.w3ir.io. They override the same keys in env_file.
      SERIES_ALLOWED_HOSTS: ${SERIES_ALLOWED_HOSTS:-lab.w3ir.io}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-lab.w3ir.io}
      AUTH_URI: ${AUTH_URI:-https://lab.w3ir.io}
    expose:
      - "5344"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5344/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
